name: Daily README Update

on:
  schedule:
    # Runs every day at 00:00 UTC (modify as needed)
    - cron: '0 0 * * *'
  # Allows you to test it manually anytime from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README.md
        run: |
          # Replace this section with whatever dynamic data or script you want to run
          TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
          sed -i "s/<!-- LAST_UPDATED -->.*/<!-- LAST_UPDATED --> *Last automated update: ${TIMESTAMP}*/" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: daily README update [skip ci]"
          git push
